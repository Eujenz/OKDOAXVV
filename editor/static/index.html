<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKDOAXVV Flow Editor</title>
  <meta name="description" content="Visual flow editor for OKDOAXVV game automation">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <div class="logo-icon">⚡</div>
      <h1>Flow Editor</h1>
      <span class="badge badge-pro">OKDOAXVV</span>
    </div>
    <div class="header-controls">
      <select id="flow-select" class="select-flow"></select>
      <button id="btn-new-flow" class="btn btn-ghost" title="新增 Flow">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="header-divider"></div>
      <button id="btn-capture" class="btn btn-accent">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 5V3a1 1 0 011-1h2M11 2h2a1 1 0 011 1v2M14 11v2a1 1 0 01-1 1h-2M5 14H3a1 1 0 01-1-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
        截圖
      </button>
      <button id="btn-save" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 14H3a1 1 0 01-1-1V3a1 1 0 011-1h7.586a1 1 0 01.707.293l2.414 2.414A1 1 0 0114 5.414V13a1 1 0 01-1 1z" stroke="currentColor" stroke-width="1.5"/><path d="M5 14V9h6v5M5 2v3h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        儲存
      </button>
    </div>
  </header>

  <!-- ═══ Main Layout ═══ -->
  <main class="app-main">
    <!-- Left: Template Library -->
    <aside class="panel panel-left" id="templates-panel">
      <div class="panel-header">
        <h2>模板庫</h2>
        <span class="count-badge" id="template-count">0</span>
      </div>
      <div id="template-list" class="template-grid"></div>
    </aside>

    <!-- Center: Flow Canvas -->
    <section class="panel panel-center" id="flow-panel">
      <div class="panel-header">
        <h2>流程步驟</h2>
        <div class="flow-meta">
          <input id="flow-task-name" class="input-inline" placeholder="任務名稱">
        </div>
      </div>
      <div id="step-list" class="step-list"></div>
      <button id="btn-add-step" class="btn btn-dashed btn-full">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        新增步驟
      </button>
    </section>

    <!-- Right: Detail Panel -->
    <aside class="panel panel-right" id="detail-panel">
      <div class="panel-header"><h2>步驟詳情</h2></div>
      <div id="step-detail" class="detail-content">
        <div class="empty-state">
          <div class="empty-icon">🎯</div>
          <p>選擇一個步驟<br>以編輯詳細設定</p>
        </div>
      </div>
      <div id="template-preview" class="preview-area"></div>
    </aside>
  </main>

  <!-- ═══ Capture Modal ═══ -->
  <div id="capture-modal" class="modal-overlay hidden">
    <div class="modal-dialog modal-large">
      <div class="modal-header">
        <h2>📸 截圖 & 框選模板</h2>
        <button class="btn-icon modal-close">&times;</button>
      </div>
      <div class="capture-body">
        <div class="capture-canvas-wrap">
          <canvas id="capture-canvas"></canvas>
          <div id="capture-coords" class="coord-display hidden">0, 0 — 0×0</div>
        </div>
        <div class="capture-sidebar">
          <label class="field-label">模板名稱</label>
          <input id="capture-name" class="input" placeholder="例: challenge_btn">
          <div id="roi-info" class="roi-info hidden">
            <div class="roi-row"><span>X</span><span id="roi-x">—</span></div>
            <div class="roi-row"><span>Y</span><span id="roi-y">—</span></div>
            <div class="roi-row"><span>寬</span><span id="roi-w">—</span></div>
            <div class="roi-row"><span>高</span><span id="roi-h">—</span></div>
          </div>
          <button id="btn-save-template" class="btn btn-primary btn-full" disabled>儲存模板</button>
          <button id="btn-recapture" class="btn btn-ghost btn-full">重新截圖</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Toast ═══ -->
  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
